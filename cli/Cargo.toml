[package]
name = "yellowstone-shield-cli"
version = "0.7.0"
edition = "2021"
description = "Yellowstone Shield CLI"
repository = "https://github.com/rpcpool/yellowstone-shield"
readme = "README.md"
license = "Apache-2.0"
publish = true

[dependencies]
clap = { workspace = true }
clap_derive = { workspace = true }
yellowstone-shield = { workspace = true, features = ["no-entrypoint"] }
yellowstone-shield-parser = { workspace = true }
yellowstone-shield-client = { path = "../clients/rust", features = ["token-extensions"] }
# Pin CLI to Solana v2.2.x (matches client)
solana-cli-config = "2.2.1"
solana-client = "2.2.1"
solana-keypair = "2.2.1"
solana-pubkey = "2.2.1"
solana-instruction = "2.2.1"
solana-message = "2.2.1"
solana-signer = "2.2.1"
solana-commitment-config = "2.2.1"
spl-token-2022 = { version = "9.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "7.0.0", features = ["no-entrypoint"] }
spl-token-metadata-interface = "0.7.0"
spl-pod = "0.5.1"
# Workspace dependencies
env_logger = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
bs58 = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
borsh = { workspace = true }
