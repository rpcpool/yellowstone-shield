[package]
name = "yellowstone-shield-client"
version = "0.7.0"
description = "A generated Rust library for the Blocklist program"
repository = "https://github.com/rpcpool/yellowstone-shield"
edition = "2021"
readme = "README.md"
license = "Apache-2.0"
publish = true

[features]
test-sbf = []
fetch = ["dep:solana-client"]
anchor-idl-build = []
anchor = ["dep:anchor-lang"]
serde = ["dep:serde", "dep:serde_with"]
token-extensions = [
  "dep:spl-associated-token-account",
  "dep:spl-token-2022",
  "dep:spl-token-metadata-interface",
  "dep:spl-pod",
]

[dependencies]
anchor-lang = { workspace = true, optional = true }
borsh = { workspace = true, features = ["derive"] }
num-derive = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_with = { workspace = true, optional = true }
# Pin client to Solana v2.2.x (keep compatible with program)
solana-keypair = "2.2.1"
solana-pubkey = { version = "2.2.1", features = ["curve25519", "borsh"] }
solana-account-info = "2.2.1"
solana-program-entrypoint = "2.2.1"
solana-cpi = "2.2.1"
solana-instruction = "2.2.1"
solana-program-error = "2.2.1"
solana-client = { version = "2.2.1", optional = true }
solana-decode-error = "2.2.1"
solana-rent = "2.2.1"
solana-msg = "2.2.1"
solana-hash = "2.2.1"
solana-program = "2.2.1"
solana-transaction = { version = "2.2.0", features = ["bincode"] }
solana-signer = "2.2.1"
spl-token-2022 = { version = "9.0.0", features = [
  "no-entrypoint",
], optional = true }
thiserror = { workspace = true }
spl-associated-token-account = { version = "7.0.0", features = [
  "no-entrypoint",
], optional = true }
spl-token-metadata-interface = { version = "0.7.0", optional = true }
spl-pod = { version = "0.5.1", optional = true }

[dev-dependencies]
assert_matches = { workspace = true }
solana-program-test = "2.2.1"
yellowstone-shield = { workspace = true }

[dev-dependencies.yellowstone-shield-client]
path = "."
features = ["token-extensions"]
