[package]
name = "yellowstone-shield"
version = "0.7.0"
edition = "2021"
readme = "./README.md"
repository = "https://github.com/rpcpool/yellowstone-shield"
license-file = "../LICENSE"
publish = false

[package.metadata.solana]
program-id = "b1ockYL7X6sGtJzueDbxRVBEEPN4YeqoLW276R3MX8W"
program-dependencies = []
account-dependencies = []

[features]
no-entrypoint = []
test-sbf = ["no-entrypoint"]

[lib]
crate-type = ["cdylib", "lib"]
doctest = false


[dependencies]
borsh = { workspace = true, features = ["derive"] }
shank = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
# Pin program to Solana v2.2.1 (do not upgrade)
solana-program = "2.2.1"
thiserror = { workspace = true }
spl-associated-token-account = { version = "6.0.0", features = ["no-entrypoint"] }
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-group-interface = "0.7.0"
spl-token-metadata-interface = "0.7.0"
spl-pod = "0.5.1"
bytemuck = "1.0.0"
pinocchio = { version = "0.8.2", features = ["std"] }
pinocchio-system = "0.2.0"
pinocchio-pubkey = "0.2.0"
