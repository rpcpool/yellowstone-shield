[rpc]
endpoint = "http://0.0.0.0:8899"

[grpc]
endpoint = "http://0.0.0.0:10000"
# Optional authentication token for gRPC
x-token = "<X-TOKEN>"

# Connection timeouts (supports human-readable durations like "60s", "1m", "30s")
timeout = "60s"
connect_timeout = "10s"

# TCP and HTTP/2 connection optimizations
tcp_nodelay = true
http2_adaptive_window = true

# HTTP/2 keep-alive settings to maintain connection health
http2_keep_alive = true
http2_keep_alive_interval = "30s"
http2_keep_alive_timeout = "10s"
http2_keep_alive_while_idle = true

# HTTP/2 flow control window sizes (in bytes)
# Larger values can improve throughput for high-bandwidth connections
# (study first instead of eyeballing numbers here)
# Read: https://httpwg.org/specs/rfc9113.html#rfc.section.6.9.1
#initial_connection_window_size = 16777216  # 1MiB or 2^24 
#initial_stream_window_size = 16777216      # 1MiB or 2^24

# Optional: Specify a custom program ID to monitor
# If not specified, defaults to the canonical Shield program ID
# program_id = "b1ockYL7X6sGtJzueDbxRVBEEPN4YeqoLW276R3MX8W"
