[workspace]
resolver = "2"
members = ["cli", "clients/rust", "parser", "program", "store"]

[workspace.package]
version = "0.6.0"

[workspace.dependencies]
# Used by program/parser/store/CLI/client
anchor-lang = "0.31.0"
anyhow = "1.0.97"
arc-swap = "1.6.0"
assert_matches = "1.5.0"
async-trait = "0.1.88"
borsh = "1.0.0"
bs58 = "0.5.1"
clap = "4.5.50"
clap_derive = "4.5.32"
env_logger = "0.11.3"
futures = "0.3.0"
hashbrown = "0.16.0"
log = "0.4.21"
num-derive = "0.4.2"
num-traits = "0.2.0"
parking_lot = "0.12.5"
serde = "1.0.0"
serde_json = "1.0.117"
serde_with = "3.0.0"
shank = "0.4.2"
thiserror = "2.0.17"
tokio = "1.48.0"
toml = "0.9.8"
# Solana SDK v3 (for parser/store only, client/CLI use pinned v2 versions)
solana-program = "3"
solana-pubkey = "3"
solana-commitment-config = "3"
solana-cli-config = "3"
solana-client = "3"
solana-account-decoder-client-types = "3"
yellowstone-shield = { path = "program" }
yellowstone-shield-cli = { path = "cli", version = "0.7.0" }
yellowstone-shield-parser = { path = "parser", version = "0.8.0" }
yellowstone-grpc-client = "10.1.1"
yellowstone-grpc-proto = "10.1.1"

[workspace.metadata.toolchains]
format = "1.86"
lint = "1.86"

[workspace.metadata.cli]
solana = "3"

[workspace.lints.clippy]
clone_on_ref_ptr = "deny"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"
